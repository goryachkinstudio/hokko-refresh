name: Refresh Hokko
on:
  schedule:
    - cron: '0 * * * *'
    - cron: '23 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hokko-statistics-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - name: Update and verify published statistics
        run: node run-http-refresh.mjs
        env:
          HOKKO_REFRESH_SERVICE_KEY: ${{ secrets.HOKKO_REFRESH_SERVICE_KEY }}
  keep-schedule-active:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Record scheduler maintenance
        run: |
          date -u +%Y-%m > schedule-maintenance.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schedule-maintenance.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record scheduler maintenance'
            git push
          fi
